; PlatformIO Project Configuration File
;
; Firmware per ESP32-S3: controllo motori (TB6612FNG) + lettura encoder
; (AS5600 x2, bus I2C separati) + comunicazione seriale binaria con
; Orange Pi 4 Pro (hardware interface ros2_control).

[env:bpi_leaf_s3]
platform = espressif32
board = bpi_leaf_s3
framework = arduino

; Velocità seriale verso Orange Pi (combacia con la hardware interface lato ROS 2)
monitor_speed = 115200
upload_speed = 921600
; Con USB-Serial/JTAG (ARDUINO_USB_MODE=1) esptool resetta il chip da solo: il trucco
; del tocco a 1200 baud serve solo con TinyUSB e la porta non cambia durante l'upload
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; Serial sulla periferica USB-Serial/JTAG (HWCDC) invece dello stack TinyUSB: con TinyUSB
    ; la trasmissione verso il Pi si bloccava dopo un po' (telemetria ferma, comandi ricevuti).
    ; Cambia l'ID USB da 303a:80df a 303a:1001 (regola udev /dev/lidarino sul Pi)
    -D ARDUINO_USB_MODE=1

lib_deps =
    MPU6500=https://github.com/bolderflight/invensense-imu.git

    bblanchon/ArduinoJson@^7.0.0   ; solo per eventuale debug seriale leggibile
    adafruit/Adafruit NeoPixel
    robtillaart/AS5600
